backend:
  - changed-files:
      - any-glob-to-any-file:
          - 'Jellyfin.Plugin.Emby/**/*.cs'
          - 'Jellyfin.Plugin.Emby/Jellyfin.Plugin.Emby.csproj'

frontend:
  - changed-files:
      - any-glob-to-any-file:
          - 'Jellyfin.Plugin.Emby/Features/Script/**/*.js'
          - 'Jellyfin.Plugin.Emby/Configuration/**/*.html'

tests:
  - changed-files:
      - any-glob-to-any-file:
          - 'Jellyfin.Plugin.Emby.Tests/**/*'

ci-cd:
  - changed-files:
      - any-glob-to-any-file:
          - '.github/**/*'

documentation:
  - changed-files:
      - any-glob-to-any-file:
          - '*.md'
          - 'docs/**/*'
